{% extends "base.html" %}
{% block title %}Error {{ error_code }}{% endblock %}

{% block content %}
<div class="empty-state" style="padding-top: 6rem;">
    <i class="bi bi-exclamation-triangle" style="font-size: 5rem; color: var(--primary);"></i>
    <h2 class="fw-bold mt-4" style="font-size: 3rem; color: #333;">{{ error_code }}</h2>
    <h4 class="text-muted mb-4">{{ error_message }}</h4>
    <p class="text-muted mb-4">Something went wrong. Please try again or contact support.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="bi bi-house me-1"></i>Back to Dashboard
    </a>
</div>
{% endblock %}
